name: SMIC Daily Trader

on:
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-trader:
    runs-on: ubuntu-latest
    steps:
      - name: 取得您的 GitHub 程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝必要的套件並強制升級
        run: |
          pip install --upgrade pip
          pip install --upgrade yfinance pandas

      - name: 執行中芯短炒檢查程式
        run: |
          python smic_trader.py
